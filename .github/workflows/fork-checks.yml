name: Fork build and onboarding checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: wizarr-fork-check:ci
          build-args: |
            APP_VERSION=2026.10.1-sbstndalton.1
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check guest onboarding without network or production data
        run: |
          docker run --rm --network none -e PYTHONPATH=/app \
            --entrypoint /app/.venv/bin/python \
            -v "$PWD/tests/fork_onboarding_smoke.py:/tmp/fork_onboarding_smoke.py:ro" \
            wizarr-fork-check:ci /tmp/fork_onboarding_smoke.py
      - name: Verify production entrypoint starts
        run: |
          trap 'docker rm -f wizarr-fork-boot >/dev/null 2>&1 || true' EXIT
          docker run -d --name wizarr-fork-boot --network none wizarr-fork-check:ci
          for attempt in $(seq 1 45); do
            if docker exec wizarr-fork-boot curl -fsS http://127.0.0.1:5690/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 100 wizarr-fork-boot
          exit 1
